# mypy backs the type-hint contract in AGENTS.md ("Use type hints
# consistently"). It starts lenient: third-party libraries are not stubbed, so
# their imports are skipped, and the modules that still carry a pre-existing
# error baseline are listed with ``ignore_errors`` below.
#
# The list is a burn-down baseline (#550): run ``mypy`` after cleaning a
# module and delete its entry. Never add an entry to silence a new error - fix
# it, or narrow the annotation. Errors in any module *not* listed here fail
# the lint job.
[mypy]
python_version = 3.10
files = openlens
ignore_missing_imports = True
show_error_codes = True

# Burn-down baseline: pre-existing errors, module by module.

[mypy-openlens.__main__]
ignore_errors = True

