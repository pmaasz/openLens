name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install -e .[dev]
      - name: Formatting (black)
        run: black --line-length=100 --exclude 'openlens/__main__\.py' openlens/ tests/ --check
      - name: Linting (flake8, blocking)
        # E9/F63/F7/F82 are correctness findings - syntax errors, invalid
        # asserts/prints and undefined names. These must fail the build.
        run: flake8 openlens/ tests/ --max-line-length=100 --ignore=E203,W503 --select=E9,F63,F7,F82
      - name: Linting (ruff, blind excepts)
        # BLE001 keeps new broad `except` handlers out of the library; the
        # boundaries and the #479 burn-down list live in ruff.toml.
        run: ruff check openlens/ tests/
      - name: Type checking (mypy)
        # Lenient baseline: mypy.ini lists the modules that still carry
        # pre-existing errors; everything else must pass. Remove an entry when
        # that module is clean - never add one to hide a new error.
        run: mypy
      - name: Linting (flake8, style - advisory)
        # The remaining ~500 style findings (E402, F401, E501, ...) are
        # tracked separately; once that cleanup lands this step drops
        # --exit-zero and becomes the blocking gate.
        run: flake8 openlens/ tests/ --max-line-length=100 --ignore=E203,W503 --exit-zero
      - name: Pre-commit hooks
        # Advisory for now: the whitespace/file-ending hooks still flag
        # pre-existing files, so the run would fail for unrelated reasons.
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        continue-on-error: true

  test:
    name: Test (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the upload with the workflow's OIDC token; no
      # long-lived CODECOV_TOKEN secret is needed (and none is configured).
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system dependencies
        # PySide6 needs these shared libraries even with QT_QPA_PLATFORM=offscreen;
        # without them the import fails (libEGL.so.1) and every GUI test errors/skips.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install dependencies
        run: |
          pip install -e .[dev]
          pip install matplotlib numpy scipy Pillow
      - name: Run test suite
        # One run per cell. The 3.11 cell goes through pytest because that is
        # also the coverage run: pytest collects the unittest modules and the
        # pytest-only GUI flow QA in a single pass. The other cells use the
        # documented unittest command.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python3 -m pytest --cov=openlens --cov-report=xml tests/
          else
            python3 -m unittest discover -s tests -t .
          fi
      - name: Upload to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          # A failed upload must fail the build: a green "coverage" job with no
          # data is worse than no coverage at all.
          fail_ci_if_error: true
      - name: Upload QA visual failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-failures
          path: /tmp/openlens_qa_failures/

  package:
    name: Package install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Build the wheel
        run: |
          pip install build
          python3 -m build --wheel --outdir /tmp/dist
      - name: Install the wheel into a clean venv
        # Deliberately NOT `pip install -e .`. Every other job installs
        # editable, so nothing here would catch a packaging defect that only
        # appears in a real install. Two already did: the `openlens` command
        # was missing because its entry module was a top-level file that
        # find_packages() could not see, and the package itself was installed
        # under the name `src`.
        run: |
          python3 -m venv /tmp/verify
          /tmp/verify/bin/pip install --upgrade pip
          /tmp/verify/bin/pip install /tmp/dist/*.whl
      - name: The installed console script runs
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /tmp/verify/bin/openlens --version
          # Prove the entry point is the real one, not a stray file that
          # happened to be on PATH.
          /tmp/verify/bin/python -c "import openlens; print(openlens.__file__)"
      - name: The package imports from the installed location
        run: |
          /tmp/verify/bin/python -c "
          from openlens.lens import Lens
          from openlens.gui.storage import LensStorage
          print('imports OK')
          "
      - name: The distribution does not install a package called `src`
        # The reported defect. `src` is the most generic directory name there
        # is; installing it into site-packages shadowed, or was shadowed by,
        # every other project on the machine with a src/ directory. Asserted on
        # the installed tree rather than on setup.py, because that is the thing
        # that actually polluted site-packages.
        run: |
          /tmp/verify/bin/python -c "
          import importlib.util, sys
          if importlib.util.find_spec('src') is not None:
              sys.exit('the wheel installed a top-level package named src')
          print('no top-level src package: OK')
          "
      - name: The default material catalog is writable on a fresh install
        # It defaulted to <package>/../data/materials.json: not shipped, and on
        # an installed copy inside site-packages, so the first add_material
        # either failed without root or polluted the venv. A fresh install must
        # have the built-in catalog and write user edits under its data dir.
        run: |
          DATA_DIR=$(mktemp -d)
          OPENLENS_DATA_DIR="$DATA_DIR" /tmp/verify/bin/python -c "
          import pathlib
          from openlens.material_database import MaterialDatabase, MaterialProperties
          from openlens.paths import default_materials_path

          db = MaterialDatabase()
          assert db.materials, 'a fresh install has no built-in materials'
          db.add_material(MaterialProperties(name='CI_GLASS', catalog='CI', nd=1.5, vd=60.0))
          path = default_materials_path()
          assert path.parent == pathlib.Path('$DATA_DIR'), path
          assert path.is_file(), path
          assert 'site-packages' not in str(path), path
          print('fresh-install catalog:', path)
          "

  no-optional-deps:
    name: Core without optional deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install the application only
        # Deliberately NOT numpy, matplotlib, scipy or Pillow. AGENTS.md
        # requires the app to start and run its core features without them,
        # and nothing here could check that: every other job installs the full
        # set, so a missing guard was invisible - the modules it protected were
        # importable anyway.
        run: |
          pip install PySide6
      - name: The application imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -c "import openlens; print('openlens imports')"
      - name: Core tests still pass
        env:
          QT_QPA_PLATFORM: offscreen
          OPENLENS_SKIP_SLOW: "1"
        run: python3 -m unittest tests.test_optional_dependency_guards -v

  docs:
    name: Docs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -e .[dev]
          pip install sphinx sphinx-rtd-theme
      - name: Build Sphinx docs
        run: cd docs/sphinx && make html

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check with twine
        run: twine check dist/*
