name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install -e .[dev]
      - name: Formatting (black)
        run: black --line-length=100 --exclude 'openlens/__main__\.py' openlens/ tests/ --check
      - name: Linting (flake8)
        run: flake8 openlens/ tests/ --max-line-length=100 --ignore=E203,W503 --exit-zero
        continue-on-error: true
      - name: Pre-commit hooks
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
        continue-on-error: true

  test:
    name: Test (py${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt system dependencies
        # PySide6 needs these shared libraries even with QT_QPA_PLATFORM=offscreen;
        # without them the import fails (libEGL.so.1) and every GUI test errors/skips.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install dependencies
        run: |
          pip install -e .[dev]
          pip install matplotlib numpy scipy Pillow
      - name: Run quick tests (skip slow suites)
        env:
          OPENLENS_SKIP_SLOW: "1"
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -t .
      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -t .
      - name: Run GUI flow QA (replaces click-through)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest tests/gui_flows -v
      - name: Upload QA visual failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-failures
          path: /tmp/openlens_qa_failures/

  package:
    name: Package install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Build the wheel
        run: |
          pip install build
          python3 -m build --wheel --outdir /tmp/dist
      - name: Install the wheel into a clean venv
        # Deliberately NOT `pip install -e .`. Every other job installs
        # editable, so nothing here would catch a packaging defect that only
        # appears in a real install. Two already did: the `openlens` command
        # was missing because its entry module was a top-level file that
        # find_packages() could not see, and the package itself was installed
        # under the name `src`.
        run: |
          python3 -m venv /tmp/verify
          /tmp/verify/bin/pip install --upgrade pip
          /tmp/verify/bin/pip install /tmp/dist/*.whl
      - name: The installed console script runs
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /tmp/verify/bin/openlens --version
          # Prove the entry point is the real one, not a stray file that
          # happened to be on PATH.
          /tmp/verify/bin/python -c "import openlens; print(openlens.__file__)"
      - name: The package imports from the installed location
        run: |
          /tmp/verify/bin/python -c "
          from openlens.lens import Lens
          from openlens.gui.storage import LensStorage
          print('imports OK')
          "
      - name: The distribution does not install a package called `src`
        # The reported defect. `src` is the most generic directory name there
        # is; installing it into site-packages shadowed, or was shadowed by,
        # every other project on the machine with a src/ directory. Asserted on
        # the installed tree rather than on setup.py, because that is the thing
        # that actually polluted site-packages.
        run: |
          /tmp/verify/bin/python -c "
          import importlib.util, sys
          if importlib.util.find_spec('src') is not None:
              sys.exit('the wheel installed a top-level package named src')
          print('no top-level src package: OK')
          "

  no-optional-deps:
    name: Core without optional deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install the application only
        # Deliberately NOT numpy, matplotlib, scipy or Pillow. AGENTS.md
        # requires the app to start and run its core features without them,
        # and nothing here could check that: every other job installs the full
        # set, so a missing guard was invisible - the modules it protected were
        # importable anyway.
        run: |
          pip install PySide6
      - name: The application imports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -c "import openlens; print('openlens imports')"
      - name: Core tests still pass
        env:
          QT_QPA_PLATFORM: offscreen
          OPENLENS_SKIP_SLOW: "1"
        run: python3 -m unittest tests.test_optional_dependency_guards -v

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt system dependencies
        # Same libraries as the test job: pytest collects the GUI tests too.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install deps
        run: pip install -e .[dev] pytest-cov matplotlib numpy
      - name: Run with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=openlens --cov-report=xml tests/
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4

  docs:
    name: Docs
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install -e .[dev]
          pip install sphinx sphinx-rtd-theme
      - name: Build Sphinx docs
        run: cd docs/sphinx && make html

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check with twine
        run: twine check dist/*
