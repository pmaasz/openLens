name: Release Please

# Keeps a Release PR open against master from Conventional Commits
# (feat: -> minor, fix: -> patch, BREAKING CHANGE -> major, minor while <1.0).
# Merging that PR creates the tag + GitHub Release + CHANGELOG + version bump.
# The release-please job then calls release.yaml in the same workflow run:
# releases created with GITHUB_TOKEN do not trigger a separate workflow run.
on:
  push:
    branches: ["master"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yaml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
