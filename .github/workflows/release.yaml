name: Release

# Fires when release-please's Release PR is merged (GitHub Release published),
# on a manual `git tag` push, or as a reusable workflow from Release Please.
# Release Please creates tags/releases with the repository GITHUB_TOKEN, and
# GitHub does not start another workflow for those events, so the Release
# Please workflow calls this file directly after `release_created` is true.
#
# Manual dispatch is a build-only smoke test: leave the tag blank to upload
# the Linux/Windows/macOS artifacts to the workflow run, or enter an existing
# tag to attach the executables to that release (PyPI is not republished).
on:
  release:
    types: [published]
  push:
    tags: ["v*", "openlens-v*"]
  workflow_call:
    inputs:
      tag_name:
        description: "Tag to build and attach to the GitHub Release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag/release to attach to; leave blank for a build-only run"
        required: false
        default: ""
        type: string

env:
  # Empty for a build-only manual dispatch. Release events, tag pushes and
  # reusable calls all supply a tag.
  RELEASE_TAG: ${{ github.event.inputs.tag_name || inputs.tag_name || github.event.release.tag_name || (github.event_name != 'workflow_dispatch' && github.ref_name) || '' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A manual run may be build-only. It never republishes PyPI, even when a
    # tag is supplied just to test attachment.
    if: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Attach dist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          files: dist/*
      - name: Publish to PyPI
        # PyPI's `openlens` distribution name belongs to an unrelated project,
        # so publishing is impossible until the name/ownership is settled
        # (#591). Keep it opt-in; the wheel and sdist still attach above.
        if: vars.PYPI_PUBLISH_ENABLED == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  executable:
    name: Executable (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: Linux
          - os: windows-latest
            suffix: Windows
          - os: macos-latest
            suffix: macOS-arm64
          - os: macos-15-intel
            suffix: macOS-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install Linux system libs (best effort)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libtiff5 || sudo apt-get install -y -qq libxcb-cursor0 libtiff6 || true
      - name: Build executable with PyInstaller
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          TAG="${TAG##*/}"
          TAG="${TAG#openlens-}"
          TAG="${TAG//\//-}"
          APP_NAME="OpenLens-${TAG}-${SUFFIX}"
          echo "APP_NAME=${APP_NAME}" >> "$GITHUB_ENV"
          # Bundle ALL runtime deps (required + optional) so the standalone
          # executable has full functionality: PySide6, numpy, matplotlib,
          # scipy, Pillow. --collect-all is needed because optional imports
          # are guarded / function-level / string-based (__import__ in
          # openlens/dependencies.py) and invisible to static analysis.
          # Mirrors openlens.spec (canonical local build: pyinstaller openlens.spec).
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "$APP_NAME" \
            --collect-all PySide6 \
            --collect-all numpy \
            --collect-all matplotlib \
            --collect-all scipy \
            --collect-all PIL \
            --hidden-import numpy \
            --hidden-import matplotlib \
            --hidden-import matplotlib.backends.backend_qtagg \
            --hidden-import matplotlib.backends.backend_qt5agg \
            --hidden-import matplotlib.figure \
            --hidden-import matplotlib.axes \
            --hidden-import matplotlib.patches \
            --hidden-import matplotlib.pyplot \
            --hidden-import scipy \
            --hidden-import scipy.special \
            --hidden-import scipy.ndimage \
            --hidden-import scipy.signal \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import PIL.ImageFont \
            --paths . \
            openlens/__main__.py
          ls -lh dist/
      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          if [ "${RUNNER_OS}" = "macOS" ]; then
            test -d "dist/${APP_NAME}.app"
            # A .app is a directory; zip the whole bundle so GitHub Releases
            # can store it and users get a normal double-clickable app.
            ditto -c -k --sequesterRsrc --keepParent \
              "dist/${APP_NAME}.app" "package/${APP_NAME}.zip"
          elif [ "${RUNNER_OS}" = "Windows" ]; then
            test -f "dist/${APP_NAME}.exe"
            cp "dist/${APP_NAME}.exe" "package/${APP_NAME}.exe"
          else
            test -f "dist/${APP_NAME}"
            cp "dist/${APP_NAME}" "package/${APP_NAME}"
          fi
          ls -lh package/
      - name: Upload build-only artifact
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: openlens-${{ github.run_id }}-${{ matrix.suffix }}
          path: package/*
          if-no-files-found: error
      - name: Attach executable to GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: package/*
