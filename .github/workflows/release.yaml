name: Release

# Fires when release-please's Release PR is merged (GitHub Release published),
# or on a manual `git tag v*` push as fallback. Builds the package, attaches
# dist/ assets to the GitHub Release, and publishes to PyPI via OIDC.
# Also builds standalone PyInstaller executables (Linux/Windows/macOS on
# both ARM64 and Intel) and attaches them to the same GitHub Release.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Attach dist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  executable:
    name: Executable (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: Linux
          - os: windows-latest
            suffix: Windows
          - os: macos-latest
            suffix: macOS-arm64
          - os: macos-15-intel
            suffix: macOS-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install Linux system libs (best effort)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libtiff5 || sudo apt-get install -y -qq libxcb-cursor0 libtiff6 || true
      - name: Build executable with PyInstaller
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          TAG="${TAG##*/}"
          APP_NAME="OpenLens-${TAG}-${{ matrix.suffix }}"
          # Bundle ALL runtime deps (required + optional) so the standalone
          # executable has full functionality: PySide6, numpy, matplotlib,
          # scipy, Pillow. --collect-all is needed because optional imports
          # are guarded / function-level / string-based (__import__ in
          # src/dependencies.py) and invisible to static analysis.
          # Mirrors openlens.spec (canonical local build: pyinstaller openlens.spec).
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "$APP_NAME" \
            --collect-all PySide6 \
            --collect-all numpy \
            --collect-all matplotlib \
            --collect-all scipy \
            --collect-all PIL \
            --hidden-import numpy \
            --hidden-import matplotlib \
            --hidden-import matplotlib.backends.backend_qtagg \
            --hidden-import matplotlib.backends.backend_qt5agg \
            --hidden-import matplotlib.figure \
            --hidden-import matplotlib.axes \
            --hidden-import matplotlib.patches \
            --hidden-import matplotlib.pyplot \
            --hidden-import scipy \
            --hidden-import scipy.special \
            --hidden-import scipy.ndimage \
            --hidden-import scipy.signal \
            --hidden-import PIL \
            --hidden-import PIL.Image \
            --hidden-import PIL.ImageDraw \
            --hidden-import PIL.ImageFont \
            openlens.py
          ls -lh dist/
          test -f "dist/${APP_NAME}" -o -f "dist/${APP_NAME}.exe"
      - name: Attach executable to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/OpenLens-*
